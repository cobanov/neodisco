[project]
name = "neodisco"
version = "0.1.0"
description = "CLIP-guided diffusion in the Disco Diffusion tradition, on current GPUs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "open_clip_torch>=2.24",
    "pillow>=10,<13",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
webui = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1"]
init = ["lpips>=0.1.4,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1.2,<2"]

[project.scripts]
neodisco = "neodisco.cli:main"
neodisco-web = "neodisco.server:main"
neodisco-benchmark = "neodisco.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neodisco"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "integration: requires CUDA and real downloaded model weights",
]
