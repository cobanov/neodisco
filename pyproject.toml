[project]
name = "neodisco"
version = "0.1.0"
description = "CLIP-guided diffusion in the Disco Diffusion tradition, on current GPUs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "open_clip_torch>=2.24",
    "pillow",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
webui = ["gradio>=4.0"]
init = ["lpips"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neodisco"]
