<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neodisco</title>
<meta name="description" content="Disco Diffusion's original models, running on current GPUs.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="neodisco">
<meta property="og:description" content="Disco Diffusion's original models, running on current GPUs.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="tr_TR">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<script>
  try { if (localStorage.getItem('lang') === 'tr') { document.documentElement.setAttribute('data-lang','tr'); document.documentElement.lang='tr'; } } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#prompt"><span lang="en">Skip to prompt</span><span lang="tr">Prompt'a geç</span></a>

<div class="hud hud-tl">
  <b>neodisco</b>
  <span class="key">512 UNCOND</span>
</div>

<div class="hud hud-tr">
  <span><span class="key">STATE</span> <span class="val" id="state">idle</span></span>
  <button class="lang-toggle" id="lang" type="button">TR</button>
</div>

<div class="hud hud-bl" id="meta">
  <span><span class="key">DIM</span> <span class="val" id="m-dim">1280&times;768</span></span>
  <span><span class="key">STEP</span> <span class="val" id="m-step">250</span></span>
  <span><span class="key">SEED</span> <span class="val" id="m-seed">—</span></span>
  <span><span class="key">TIME</span> <span class="val" id="m-time">—</span></span>
</div>

<main class="stage" id="stage">
  <div class="frame" id="frame">
    <i aria-hidden="true"></i>
    <div class="ghost" id="ghost">
      <span class="dim">
        <em id="ghost-dim">1280 &times; 768</em>
        <span id="ghost-note"><span lang="en">write a prompt</span><span lang="tr">bir prompt yaz</span></span>
      </span>
    </div>
  </div>
</main>

<div class="err" id="err" hidden></div>

<form class="console" id="form">
  <div class="ratios" id="ratios" role="group" aria-label="Aspect ratio">
    <button type="button" data-w="768"  data-h="768"  aria-pressed="false">1:1</button>
    <button type="button" data-w="1152" data-h="768"  aria-pressed="false">3:2</button>
    <button type="button" data-w="1280" data-h="768"  aria-pressed="true">5:3</button>
    <button type="button" data-w="1024" data-h="576"  aria-pressed="false">16:9</button>
    <button type="button" data-w="768"  data-h="1152" aria-pressed="false">2:3</button>
    <button type="button" data-w="576"  data-h="1024" aria-pressed="false">9:16</button>
  </div>
  <div class="entry">
    <span class="caret" aria-hidden="true">&rsaquo;</span>
    <textarea id="prompt" rows="1" spellcheck="false" enterkeyhint="go"
      placeholder="describe the picture, then the artists"></textarea>
    <button class="icon-btn" id="dice" type="button" title="Example prompt" aria-label="Example prompt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm3 3.6a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm8 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm-4 4a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm-4 4a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm8 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Z"/></svg>
    </button>
    <button id="go" type="submit"><span lang="en">Generate</span><span lang="tr">Üret</span></button>
  </div>
</form>

<div class="progress"><i id="bar"></i></div>

<script src="app.js"></script>
<script defer src="https://oa-c.cobanov.run/oa.js"></script>
</body>
</html>
